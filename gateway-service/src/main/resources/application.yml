server:
  port: 8080
  shutdown: graceful   # Boot 3.4+ default, explicit here: finish in-flight requests (max spring.lifecycle.timeout-per-shutdown-phase, 30 s) before stopping

spring:
  application:
    name: gateway-service
  ssl:
    bundle: # spring.ssl.bundle.jks.<name>: TLS material by name; certs/generate-certs.sh writes src/main/resources/tls/
      jks:
        service-identity: # this service's own certificate (CN=gateway-service,OU=learning-spring-cloud) + the CA it trusts, used in both directions
          key:
            alias: identity
          keystore: # presented as server certificate (server.ssl.bundle) and as client certificate when a server asks (mTLS)
            location: classpath:tls/identity.p12
            password: ${TLS_KEYSTORE_PASSWORD:changeit}
            type: PKCS12
          truststore: # the dev CA: verifies servers this service calls, and client certificates sent to it
            location: classpath:tls/truststore.p12
            password: ${TLS_TRUSTSTORE_PASSWORD:changeit}
            type: PKCS12
  security:
    user:
      name: ${ACTUATOR_USER:admin}
      password: ${ACTUATOR_PASSWORD:admin}
      roles: ACTUATOR
  quartz:
    job-store-type: memory   # backs /actuator/quartz (SBA Quartz view)
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            ssl:
              ssl-bundle: ${app.tls.client-bundle}   # lb:// picks https for instances registered secure (order, product)
          # Authorization header is forwarded to downstream as-is (no RemoveRequestHeader filter) —
          # user/order/product services require the same Basic creds the client sent to the gateway.
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products/**
            - id: user-service-api-docs
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api-docs/user-service
              filters:
                - SetPath=/v3/api-docs
            - id: order-service-api-docs
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api-docs/order-service
              filters:
                - SetPath=/v3/api-docs
            - id: product-service-api-docs
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api-docs/product-service
              filters:
                - SetPath=/v3/api-docs

# Swagger UI at http://localhost:8080/swagger-ui.html with a dropdown of the three service specs. Each
# spec's server URL is relative ("/"), so "Try it out" calls the gateway, which routes /api/** as usual.
springdoc:
  api-docs:
    enabled: true            # the UI needs springdoc's config endpoint; the gateway's own spec is empty
  swagger-ui:
    urls:
      - name: user-service
        url: /api-docs/user-service
      - name: order-service
        url: /api-docs/order-service
      - name: product-service
        url: /api-docs/product-service
    urls-primary-name: user-service

app:
  tls: # SSL bundle names, declared once here; server.ssl, HTTP clients and the Eureka TLS beans all reference these
    client-bundle: service-identity   # outbound: certificate sent when a server asks for one + CA that servers must chain to
  security:
    public-paths: # reachable without auth; everything else needs Basic/form login
      - "/actuator/health/**"
      - "/actuator/info"
      - "/swagger-ui.html"
      - "/swagger-ui/**"
      - "/webjars/swagger-ui/**"
      - "/v3/api-docs/**"
      - "/api-docs/**"   # service specs, routed to each service's public /v3/api-docs
      - "/error"

eureka:
  server:
    instances: # registry nodes, read by defaultZone below; same list in every module
      - localhost:8761
      - 127.0.0.1:8762
      - 127.0.0.2:8763
  client:
    service-url:
      # one https:// URL per eureka.server.instances entry (every node serves TLS); Basic credentials go in each URL
      defaultZone: https://${spring.security.user.name}:${spring.security.user.password}@${eureka.server.instances[0]}/eureka/,https://${spring.security.user.name}:${spring.security.user.password}@${eureka.server.instances[1]}/eureka/,https://${spring.security.user.name}:${spring.security.user.password}@${eureka.server.instances[2]}/eureka/
  instance:
    lease-renewal-interval-in-seconds: 10      # heartbeat every 10 s (default 30)
    lease-expiration-duration-in-seconds: 30   # evicted 30 s after the last heartbeat (default 90)
    prefer-ip-address: true
    metadata-map:
      user.name: ${spring.security.user.name}           # SBA uses these to poll the secured actuator
      user.password: ${spring.security.user.password}
      tags.environment: ${APP_ENV:local}   # SBA shows tags.* as badges in the application list
      tags.tier: edge

info: # published by /actuator/info (needs management.info.env.enabled) → SBA Details → Info
  app:
    name: ${spring.application.name}
    description: API gateway routing /api/** to backend services via Eureka
    tier: edge
    environment: ${APP_ENV:local}

logging:
  file:
    name: logs/${spring.application.name}.log   # enables /actuator/logfile (SBA Logfile view)

management:
  tracing:
    sampling:
      probability: 1.0    # trace every request (demo); Boot's default is 0.1
  opentelemetry:
    tracing:
      export:
        otlp:
          # OTLP/HTTP receiver of zipkin-server (zipkin-module-otel), same port as the Zipkin UI
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:9411/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false    # the starter also brings micrometer-registry-otlp; only traces are exported
  info: # extra contributors shown in SBA Details → Info
    env:
      enabled: true       # info.* properties above
    java:
      enabled: true       # JDK vendor/version, JVM
    os:
      enabled: true       # OS name/version/arch
    process:
      enabled: true       # PID, CPUs, memory
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway
          - env
          - metrics
          - loggers
          - threaddump
          - heapdump
          - mappings
          - beans
          - configprops
          - logfile
          - shutdown
          - restart
          - refresh
          - httpexchanges
          - startup
          - auditevents
          - sbom
          - quartz
  endpoint:
    shutdown:
      access: unrestricted   # SBA "Shutdown" button
    restart:
      access: unrestricted   # SBA "Restart" button (Spring Cloud Context)
    refresh:
      access: unrestricted   # SBA "Refresh" on Environment: re-binds @ConfigurationProperties / @RefreshScope
    env:
      post:
        enabled: true        # SBA Environment "Update" form (POST /actuator/env, Spring Cloud Context)
    health:
      show-details: always
      probes:
        enabled: true     # /actuator/health/liveness + /readiness groups (SBA Details → Health)
    heapdump:
      access: unrestricted
    gateway:
      access: unrestricted
