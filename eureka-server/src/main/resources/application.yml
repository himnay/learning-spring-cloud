# One module for every registry node: the profile picks which node this process is. Run two or three for HA:
#   peer1  :8761  hostname localhost   (also the default: active unless peer2 or peer3 is)
#   peer2  :8762  hostname 127.0.0.1
#   peer3  :8763  hostname 127.0.0.2
# All nodes share one defaultZone listing the three; for replication a node drops the entry whose host equals its own
# eureka.instance.hostname (the port is ignored), so the hostnames must differ. All three are loopback, no /etc/hosts
# entry: Linux and Windows route all of 127.0.0.0/8 to loopback, macOS needs `sudo ifconfig lo0 alias 127.0.0.2` once.
server:
  shutdown: graceful   # Boot 3.4+ default, explicit here: finish in-flight requests (max spring.lifecycle.timeout-per-shutdown-phase, 30 s) before stopping

spring:
  application:
    name: eureka-server   # same app name on every node: one EUREKA-SERVER app with one instance per node (dashboard replica check needs it)
  security:
    user:
      name: ${ACTUATOR_USER:admin}
      password: ${ACTUATOR_PASSWORD:admin}
      roles: ACTUATOR
  quartz:
    job-store-type: memory

app:
  security:
    public-paths: # reachable without auth; everything else needs Basic/form login
      - "/actuator/health/**"
      - "/actuator/health"
      - "/actuator/info"
      - "/error"

eureka:
  environment: ${EUREKA_ENVIRONMENT:SIT}   # dashboard header "Environment" (default: test)
  datacenter: ${EUREKA_DATACENTER:TX}      # dashboard header "Data center" (default: default)
  instance:
    lease-renewal-interval-in-seconds: 10      # heartbeat every 10 s (default 30)
    lease-expiration-duration-in-seconds: 30   # evicted 30 s after the last heartbeat (default 90)
    metadata-map:
      # SBA discovers this node from the registry and polls /actuator with these credentials
      user.name: ${spring.security.user.name}
      user.password: ${spring.security.user.password}
      tags.environment: ${APP_ENV:local}   # SBA shows tags.* as badges in the application list
      tags.tier: infra
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${spring.security.user.name}:${spring.security.user.password}@localhost:8761/eureka/,http://${spring.security.user.name}:${spring.security.user.password}@127.0.0.1:8762/eureka/,http://${spring.security.user.name}:${spring.security.user.password}@127.0.0.2:8763/eureka/
  server:
    # on everywhere: a network blip can't mass-evict the registry (and the dashboard drops the
    # "SELF PRESERVATION MODE IS TURNED OFF" banner); EUREKA_SELF_PRESERVATION=false to opt out
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}
    # self-preservation trips below this share of expected renewals; 0.5 locally so killing one or two
    # services in a ~8-instance demo still evicts them (prod profile: 0.85)
    renewal-percent-threshold: ${EUREKA_RENEWAL_THRESHOLD:0.5}
    expected-client-renewal-interval-seconds: 10                  # must match clients' lease-renewal-interval-in-seconds
    eviction-interval-timer-in-ms: 30000                          # eviction sweep every 30 s (default 60 s)

info: # published by /actuator/info (needs management.info.env.enabled) → SBA Details → Info
  app:
    name: ${spring.application.name}
    description: Eureka service registry
    tier: infra
    environment: ${APP_ENV:local}

logging:
  file:
    name: logs/${spring.application.name}-${server.port}.log   # one file per node; enables /actuator/logfile (SBA Logfile view)

management:
  info: # extra contributors shown in SBA Details → Info
    env:
      enabled: true       # info.* properties above
    java:
      enabled: true       # JDK vendor/version, JVM
    os:
      enabled: true       # OS name/version/arch
    process:
      enabled: true       # PID, CPUs, memory
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - heapdump
          - logfile
          - env
          - shutdown
          - restart
          - refresh
          - metrics
          - loggers
          - threaddump
          - configprops
          - beans
          - mappings
          - httpexchanges
          - startup
          - auditevents
          - sbom
          - quartz
          - jolokia
  endpoint:
    shutdown:
      access: unrestricted   # SBA "Shutdown" button
    restart:
      access: unrestricted   # SBA "Restart" button (Spring Cloud Context)
    refresh:
      access: unrestricted   # SBA "Refresh" on Environment: re-binds @ConfigurationProperties / @RefreshScope
    env:
      post:
        enabled: true        # SBA Environment "Update" form (POST /actuator/env, Spring Cloud Context)
    health:
      show-details: always
      probes:
        enabled: true     # /actuator/health/liveness + /readiness groups (SBA Details → Health)
    heapdump:
      access: unrestricted

---
# Node 1. Also active when neither peer2 nor peer3 is: plain spring-boot:run, IDE run, tests, prod alone
spring:
  config:
    activate:
      on-profile: "peer1 | !(peer2 | peer3)"

server:
  port: 8761

eureka:
  instance:
    hostname: localhost

---
# Node 2
spring:
  config:
    activate:
      on-profile: peer2

server:
  port: 8762

eureka:
  instance:
    hostname: 127.0.0.1

---
# Node 3, optional: while it is down the other nodes list it under unavailable-replicas and log a connection error
# for it every 10 s
spring:
  config:
    activate:
      on-profile: peer3

server:
  port: 8763

eureka:
  instance:
    hostname: 127.0.0.2

---
# Production profile, on top of a node (SPRING_PROFILES_ACTIVE=peer2,prod; prod alone is peer1): keep the registry
# during network partitions instead of evicting everything at once — see the root README FAQ on self-preservation.
spring:
  config:
    activate:
      on-profile: prod

eureka:
  environment: ${EUREKA_ENVIRONMENT:prod}
  server:
    enable-self-preservation: true
    renewal-percent-threshold: ${EUREKA_RENEWAL_THRESHOLD:0.85}   # lower (e.g. 0.5) for small clusters
